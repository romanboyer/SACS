<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACS - SHOP</title>
    
    <!-- Import de la police Anton pour le nom SACS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2f2f2; 
            --text-color: #000000;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / LOGO À GAUCHE / MARQUE À DROITE */
        header {
            width: 100%;
            padding: 2rem 5%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-link img {
            max-height: 50px;
            width: auto;
        }

        .brand-name {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            text-decoration: none;
            color: var(--text-color);
        }

        /* PAGE PRINCIPALE : LE T-SHIRT ET LE BOUTON */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding-bottom: 4rem;
        }

        .product-teaser {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .product-teaser:hover {
            transform: scale(1.02);
        }

        .product-teaser img {
            max-width: 250px;
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* BOUTONS (COMMUNS) */
        .btn-black {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 1rem 3rem;
            border: none;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            width: 100%;
            text-align: center;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-black:hover {
            background-color: #333333;
        }

        /* FENÊTRE MODALE (POP-UP D'ACHAT) - ÉPURÉE */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(242, 242, 242, 0.98);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: transparent;
            padding: 2rem;
            max-width: 900px;
            width: 90%;
            display: flex;
            gap: 4rem;
            position: relative;
            align-items: center;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column;
                gap: 1.5rem;
                height: 80vh;
                overflow-y: auto;
            }
        }

        .close-btn {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 3rem;
            font-weight: normal;
            cursor: pointer;
            line-height: 1;
            color: #000;
        }

        .gallery-container {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .main-image {
            width: 100%;
            max-width: 400px;
            height: auto;
            object-fit: contain;
        }

        .details-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .details-container h2 {
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin: 0 0 0.5rem 0;
        }

        .details-container .price {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        .paypal-wrapper {
            margin-top: 1.5rem;
            width: 100%;
        }

        /* STYLE DU FORMULAIRE DE COMMANDE */
        .order-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 1rem;
            border: 2px solid #000;
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .form-input:focus {
            outline: none;
            background-color: #fff;
        }

        /* Alignement Code postal et Ville */
        .form-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .zip-input {
            flex: 1;
        }

        .city-input {
            flex: 2;
        }

        /* GUIDE DES TAILLES */
        .size-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: -0.5rem;
        }
        
        .size-guide-btn {
            font-size: 0.85rem;
            text-decoration: underline;
            cursor: pointer;
            color: #555;
        }

        .size-guide-btn:hover {
            color: #000;
        }

        .size-table-container {
            display: none;
            background-color: #fff;
            border: 2px solid #000;
            padding: 1rem;
            font-size: 0.9rem;
        }

        .size-table-container.active {
            display: block;
        }

        .size-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        .size-table th, .size-table td {
            padding: 0.5rem;
            border-bottom: 1px solid #ddd;
        }

        .size-table th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- HEADER: Logo à gauche, Marque à droite -->
    <header>
        <a href="index.html" class="logo-link">
            <img src="./images/logo.png" alt="Logo">
        </a>
        <a href="index.html" class="brand-name">SACS</a>
    </header>

    <!-- PAGE PRINCIPALE -->
    <main>
        <div class="product-teaser" onclick="openModal()">
            <img src="./images/tee2.png" alt="T-shirt">
            <button class="btn-black">PRÉCOMMANDER</button>
        </div>
    </main>

    <!-- FENÊTRE MODALE -->
    <div class="modal-overlay" id="shopModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <div class="gallery-container">
                <img src="./images/tee2.png" id="mainGalleryImage" class="main-image">
            </div>

            <div class="details-container">
                <h2>SHUT UP AND CREATE SOMETHING</h2>
                <div class="price">30,00 €</div>
                <p>100% coton organique. 250gsm. Coupe boxy. Sérigraphie artisanale.</p>
                
                <div class="paypal-wrapper">
                    <!-- FORMULAIRE CIBLÉ PAR JAVASCRIPT -->
                    <form id="orderForm" class="order-form">
                        
                        <!-- Ligne Guide des tailles -->
                        <div class="size-header">
                            <span class="size-guide-btn" onclick="toggleSizeGuide()">Guide des tailles</span>
                        </div>

                        <!-- Tableau déroulant caché par défaut -->
                        <div class="size-table-container" id="sizeGuideBox">
                            <table class="size-table">
                                <tr>
                                    <th>Taille</th>
                                    <th>Largeur poitrine (cm)</th>
                                    <th>Longueur totale de la ceinture au cou (cm)</th>
                                </tr>
                                <tr><td>S</td><td>54</td><td>69,5</td></tr>
                                <tr><td>M</td><td>56</td><td>71,25</td></tr>
                                <tr><td>L</td><td>58</td><td>73</td></tr>
                                <tr><td>XL</td><td>62</td><td>75</td></tr>
                            </table>
                        </div>

                        <select name="Taille" required class="form-input">
                            <option value="" disabled selected>Sélectionnez votre taille</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                        </select>

                        <input type="text" name="Nom_Complet" placeholder="Prénom et Nom" required class="form-input">
                        
                        <input type="text" name="Instagram" placeholder="Pseudo Instagram (@)" required class="form-input">
                        
                        <input type="text" name="Adresse" placeholder="Adresse (N° et rue)" required class="form-input">

                        <div class="form-row">
                            <input type="text" name="Code_Postal" placeholder="Code postal" required class="form-input zip-input">
                            <input type="text" name="Ville" placeholder="Ville" required class="form-input city-input">
                        </div>

                        <button type="submit" class="btn-black">VALIDER LA PRÉCOMMANDE</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // Gestion de la fenêtre modale
        const modal = document.getElementById('shopModal');

        function openModal() {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            document.getElementById('sizeGuideBox').classList.remove('active'); // Réinitialise le guide des tailles
        }

        modal.addEventListener('click', function(e) {
            if (e.target === modal || e.target.classList.contains('modal-content')) {
                closeModal();
            }
        });

        // Toggle du guide des tailles
        function toggleSizeGuide() {
            const box = document.getElementById('sizeGuideBox');
            box.classList.toggle('active');
        }

        // Gestion de l'envoi du formulaire AJAX vers Google Sheets
        document.getElementById("orderForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Empêche le rechargement de la page

            const form = event.target;
            const data = new FormData(form);

            const scriptURL = "https://script.google.com/macros/s/AKfycbxmoikp3HlUj4UOhbdq1iivTy928Xnxa4pX4-Tz9pe3adHce7gccNPvst6vKr4vEEUX/exec";

            fetch(scriptURL, {
                method: "POST",
                body: data
            })
            .then(response => {
                alert("Précommande enregistrée avec succès ! Nous te contacterons très vite sur Instagram pour finaliser le paiement.");
                form.reset();
                closeModal();
            })
            .catch(error => {
                alert("Erreur de connexion lors de l'enregistrement de ta précommande. Veuillez réessayer.");
                console.error('Erreur:', error);
            });
        });
    </script>
</body>
</html>
