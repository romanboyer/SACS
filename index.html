<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACS - SHOP</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f2f2f2; 
            --text-color: #000000;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / LOGO À GAUCHE / MARQUE À DROITE */
        header {
            width: 100%;
            padding: 2rem 5%;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-link img {
            max-height: 72px;
            width: auto;
        }

        .brand-name {
            font-family: 'Anton', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin: 0;
            line-height: 1;
            text-decoration: none;
            color: var(--text-color);
        }

        /* PAGE PRINCIPALE */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .product-teaser {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.25rem;
            padding: 2rem 5% 4rem;
            text-align: center;
        }

        .product-teaser h1 {
            margin: 0;
            width: 100%;
            font-size: clamp(2.4rem, 6.5vw, 6.5rem);
            font-weight: 400;
            font-family: 'Archivo Black', 'Helvetica Neue', Arial, sans-serif;
            line-height: 0.95;
            letter-spacing: -0.035em;
            cursor: pointer;
            transition: color 0.25s ease, transform 0.25s ease;
        }

        .product-teaser h1:hover {
            color: #444;
            transform: translateY(-3px) scale(1.02);
        }

        .archive-button {
            color: #666;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .archive-button:hover {
            color: #000;
        }

        .archive-button:focus-visible,
        .instagram-link:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 4px;
        }

        footer {
            padding: 1.25rem 5% 1.5rem;
            text-align: center;
        }

        .instagram-link {
            color: #666;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .instagram-link:hover {
            color: #000;
        }

        @media (prefers-reduced-motion: reduce) {
            .product-teaser h1,
            .archive-button,
            .instagram-link {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER: Logo à gauche, Marque à droite -->
    <header>
        <a href="index.html" class="logo-link">
            <img src="./images/logo.png" alt="Logo">
        </a>
        <a class="instagram-link" href="https://www.instagram.com/sacsomething/" target="_blank" rel="noopener noreferrer">@sacsomething</a>
    </header>

    <!-- PAGE PRINCIPALE -->
    <main>
        <article class="product-teaser">
            <h1>ON TRAVAILLE SUR LA SUITE.</h1>
            <a class="archive-button" href="archives.html">Voir les archives</a>
        </article>
    </main>
    <footer>
        <a class="instagram-link" href="https://www.instagram.com/sacsomething/" target="_blank" rel="noopener noreferrer">@sacsomething</a>
    </footer>
</body>
</html>
